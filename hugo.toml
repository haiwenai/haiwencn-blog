baseURL = "https://blog.haiwencn.com/"
languageCode = "zh"
defaultContentLanguage = "zh"
title = "海文AI手记"
hasCJKLanguage = true
theme = "PaperMod"
paginate = 10

[params]
  env = "production"
  author = "海文"
  description = "AI 实践中的思考与判断。"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowToc = true
  TocOpen = false
  ShowRelatedContent = false

  [params.homeInfoParams]
    Title = "海文AI手记"
    Content = "记录 AI 实践中的思考与判断。关注 AI Agent、投资、个人基础设施。"

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[params.assets]
  disableHLJS = true

[markup]
  [markup.highlight]
    noClasses = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

[[menus.main]]
  name = "文章"
  url = "/posts/"
  weight = 1

[[menus.main]]
  name = "标签"
  url = "/tags/"
  weight = 2

[[menus.main]]
  name = "搜索"
  url = "/search/"
  weight = 3

[[menus.main]]
  name = "归档"
  url = "/archives/"
  weight = 4
